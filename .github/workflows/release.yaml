name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: バージョン番号の更新タイプ
        required: true
        type: choice
        options:
          - バグフィックス
          - マイナーバージョンアップ
          - メジャーバージョンアップ
        default: バグフィックス

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          echo "Checking CI for commit: ${commit_sha}"

          for i in $(seq 1 60); do
            conclusion="$(gh run list --workflow=ci.yaml --branch=master --commit="${commit_sha}" -L1 --json conclusion --jq '.[0].conclusion')"
            echo "Attempt ${i}: conclusion=${conclusion}"
            if [ "${conclusion}" = "success" ]; then
              echo "CI passed"
              exit 0
            elif [ "${conclusion}" = "failure" ] || [ "${conclusion}" = "cancelled" ]; then
              echo "Error: CI が成功していません (conclusion: ${conclusion})"
              exit 1
            fi
            sleep 30
          done

          echo "Error: CI の完了待ちがタイムアウトしました"
          exit 1

      - name: Calculate next version
        id: next
        run: |
          set -euo pipefail

          # 再実行時の冪等性: HEADを指すリリースタグが既にあれば再利用
          existing_tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.' | head -n1 || true)"
          if [ -n "${existing_tag}" ]; then
            echo "Found existing tag ${existing_tag} on HEAD, reusing"
            echo "next=${existing_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEADにタグがなければ、latestからインクリメント
          git fetch --tags
          latest=$(git tag --sort=version:refname | tail -n1)
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case '${{ github.event.inputs.bump }}' in
            'バグフィックス') ((++patch));;
            'マイナーバージョンアップ') ((++minor)); patch=0;;
            'メジャーバージョンアップ') ((++major)); minor=0; patch=0;;
            *) echo "Unknown bump: '${{ github.event.inputs.bump }}'" >&2; exit 1;;
          esac
          echo "next=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Create tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.next.outputs.next }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.next.outputs.next }} already exists, skipping"
          else
            git tag "${{ steps.next.outputs.next }}"
            git push origin "${{ steps.next.outputs.next }}"
          fi

      - name: Generate release notes
        uses: orhun/git-cliff-action@e16f179f0be49ecdfe63753837f20b9531642772 # v4.7.0
        with:
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Append changelog link
        run: |
          prev_tag="$(git tag --sort=version:refname | grep -E '^v[0-9]' | tail -2 | head -1)"
          printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "${{ github.repository }}" "${prev_tag}" "${{ steps.next.outputs.next }}" >> CHANGES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.next.outputs.next }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.next.outputs.next }} already exists, skipping"
          else
            gh release create "${{ steps.next.outputs.next }}" \
              --title "${{ steps.next.outputs.next }}" --target=master --notes-file CHANGES.md
          fi

      - name: Run deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yaml --ref=master
