name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: バージョン番号の更新タイプ
        required: true
        type: choice
        options:
          - PATCH
          - MINOR
          - MAJOR
        default: PATCH

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check release branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Dispatch this workflow on master to release a commit tested by CI." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"
          echo "Checking CI result for commit: ${commit_sha}"

          # 最大待機時間 (秒): 30 分
          max_wait=1800
          wait_interval=30
          elapsed=0

          while [ "${elapsed}" -lt "${max_wait}" ]; do
            # ci.yaml ワークフローの最新の実行結果を取得
            workflow_runs="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/actions/workflows/ci.yaml/runs?branch=master&head_sha=${commit_sha}&per_page=1")"

            total_count="$(echo "${workflow_runs}" | jq -r '.total_count')"
            if [ "${total_count}" = "0" ]; then
              echo "No CI workflow found for sha=${commit_sha}. Waiting..."
              sleep "${wait_interval}"
              elapsed="$((elapsed + wait_interval))"
              continue
            fi

            status="$(echo "${workflow_runs}" | jq -r '.workflow_runs[0].status')"
            conclusion="$(echo "${workflow_runs}" | jq -r '.workflow_runs[0].conclusion')"
            echo "Current status: ${status}, conclusion: ${conclusion}"

            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" = "success" ]; then
                echo "CI passed successfully"
                exit 0
              fi
              echo "Error: CI did not succeed (conclusion: ${conclusion}). Fix the failing CI run for this commit, then re-run the release workflow."
              exit 1
            fi

            echo "CI is still running. Waiting ${wait_interval}s..."
            sleep "${wait_interval}"
            elapsed="$((elapsed + wait_interval))"
          done

          echo "Error: Timeout waiting for CI to complete. Check that the CI workflow for this commit has finished, then re-run the release workflow."
          exit 1

      - name: Calculate next version
        id: next
        run: |
          set -euo pipefail

          # 再実行時の冪等性: HEAD を指すリリースタグが既にあれば再利用
          existing_tag="$(git tag --points-at=HEAD | grep -E '^v[0-9]+\.' | head -n1 || true)"
          if [ -n "${existing_tag}" ]; then
            echo "Found existing tag ${existing_tag} on HEAD, reusing it. No action is needed (the release continues)."
            echo "next=${existing_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD にタグがなければ、latest からインクリメント
          latest=$(git tag --sort=version:refname | tail -n1)
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case '${{ github.event.inputs.bump }}' in
            'PATCH') ((++patch));;
            'MINOR') ((++minor)); patch=0;;
            'MAJOR') ((++major)); minor=0; patch=0;;
            *) echo "Unknown bump: '${{ github.event.inputs.bump }}'" >&2; exit 1;;
          esac
          echo "next=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Create tag and push
        env:
          TAG: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if tag_commit="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")"; then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG does not point to $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git tag -- "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Append changelog link
        run: |
          prev_tag="$(git tag --sort=version:refname | grep -E '^v[0-9]' | tail -2 | head -1)"
          printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "${{ github.repository }}" "${prev_tag}" "${{ steps.next.outputs.next }}" >> CHANGES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          if gh release view --json body --jq .body -- "$TAG" > release-notes.md; then
            if grep -Fxq '### ビルド来歴の検証' release-notes.md; then
              exit 0
            fi
            existing_release=true
          else
            cp CHANGES.md release-notes.md
            existing_release=false
          fi

          cat >> release-notes.md <<'NOTES'

          ### ビルド来歴の検証

          [証明一覧](https://github.com/ak110/GLATasks/attestations)。
          証明のソースコミットはこのReleaseのタグが指すコミット。
          GitHub CLIで `gh auth login` を実行するか、`GH_TOKEN` を設定してから検証する。
          配備に成功すると、実際のイメージのdigestを指定したコマンドが追記される。

          ```bash
          gh attestation verify "oci://ghcr.io/ak110/glatasks@${IMAGE_DIGEST}" \
            --repo ak110/GLATasks --signer-workflow ak110/GLATasks/.github/workflows/deploy.yaml \
            --source-digest "${SOURCE_COMMIT}"
          ```
          NOTES

          if "$existing_release"; then
            gh release edit --notes-file release-notes.md -- "$TAG"
          else
            gh release create --verify-tag --title="$TAG" --notes-file=release-notes.md -- "$TAG"
          fi

      - name: Run deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.next }}
        run: gh workflow run deploy.yaml --ref "$TAG" -F update_release=true
