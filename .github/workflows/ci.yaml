name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
    defaults:
      run:
        shell: bash
    env:
      # mise・pinact 等が GitHub API へアクセスする際の rate limit (403) 回避。
      # container job では明示しないと secrets.GITHUB_TOKEN がコンテナへ渡らない
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GitHub Actionsのピン留め検証
        run: pinact run --check

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /cache
          # run_idはワークフローの再実行でも変化せず、run_attemptは試行ごとに増加する。
          # 試行ごとに異なる主キーを使い、完全一致による保存抑止を避ける。
          # 前方一致で復元した/cacheへジョブ中の変更を加え、成功かつ書き込み可能な試行では、
          # 別キーとして保存して次回へ引き継ぐ。
          key: pyfltr-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pyfltr-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint with pyfltr
        run: pyfltr ci --output-format=github-annotations

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: CI 用 .env を生成
        run: |
          DATA_DIR="${RUNNER_TEMP}/glatasks-data"
          mkdir -p "${DATA_DIR}"
          chmod 777 "${DATA_DIR}"
          {
            echo "COMPOSE_PROFILE=production"
            echo "DATA_DIR=${DATA_DIR}"
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
          } > .env

      - name: SSL 自己署名証明書を生成
        run: |
          cp web/openssl.cnf-example web/openssl.cnf
          bash web/keygen.sh

      - name: Build production image (ghcr.io/ak110/glatasks:latest)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ghcr.io/ak110/glatasks:latest

      - name: Start stack (production profile)
        run: docker compose --profile=production up -d --wait

      - name: Run backup test
        run: make test-backup

      - name: Run e2e test
        run: |
          docker compose --profile=production --profile=ci run --rm \
            --env=BASE_URL=https://web \
            --env=CI=true \
            playwright \
            bash -xc '
              PNPM_VERSION=$(node -e "const p=require(\"./package.json\"); console.log((p.packageManager||\"\").split(\"@\")[1]?.split(\"+\")[0]||\"latest\")") &&
              npm install -g pnpm@${PNPM_VERSION} --prefix=${PWD}/.cache/playwright --force &&
              export PATH=${PWD}/.cache/playwright/bin:${PWD}/node_modules/.bin:$PATH &&
              pnpm install --frozen-lockfile &&
              pnpm run test:e2e
            '

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --profile=production --profile=ci logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose --profile=production --profile=ci down --volumes --remove-orphans
