name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
    defaults:
      run:
        shell: bash
    env:
      # mise 等が GitHub API へアクセスする際の rate limit (403) 回避。
      # container job では明示しないと secrets.GITHUB_TOKEN がコンテナへ渡らない
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # キャッシュのキーへ使うpyfltrの版。イメージが同梱するツール群はpyfltrの版で決まる。
      - name: Resolve pyfltr version
        id: pyfltr
        run: echo "version=$(pyfltr --version | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"

      # pyfltr推奨ガイドの構成（/cache全体をrun_id付きキーとrestore-keysで毎回保存）から意図して外れる。
      # 2026年11月の計測では、ジョブが/cacheへ加えるのはmiseの約86MBだけで、uvとpnpmはイメージ同梱の内容から変わらなかった。
      # 毎回の復元と再保存で古い内容とイメージ同梱分が累積し（約2.7GB）、保存に約5分かかっていた。
      # そこでジョブが変更する/cache/miseだけを、内容を決める入力（pyfltrの版と設定ファイル）のハッシュで保存する。
      # 入力が同じ実行は完全一致で復元して保存を省き、入力が変わった最初の成功した実行が新しい内容を保存して次回へ引き継ぐ。
      # restore-keysを置かないのは、入力の変わったキャッシュへ古い版のツールを累積させないためである。
      # 推奨ガイドへ同じ構成を反映するかはpyfltr側で検討する。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /cache/mise
          key: pyfltr-mise-${{ runner.os }}-${{ steps.pyfltr.outputs.version }}-${{ hashFiles('pyproject.toml', 'mise.toml', 'pnpm-lock.yaml') }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint with pyfltr
        run: pyfltr ci --output-format=github-annotations

  integration:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: CI 用 .env を生成
        run: |
          DATA_DIR="${RUNNER_TEMP}/glatasks-data"
          mkdir -p "${DATA_DIR}"
          chmod 777 "${DATA_DIR}"
          {
            echo "COMPOSE_PROFILE=production"
            echo "DATA_DIR=${DATA_DIR}"
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
          } > .env

      - name: SSL 自己署名証明書を生成
        run: |
          cp web/openssl.cnf-example web/openssl.cnf
          bash web/keygen.sh

      - name: Build production image (ghcr.io/ak110/glatasks:latest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ghcr.io/ak110/glatasks:latest

      - name: Start stack (production profile)
        run: docker compose --profile=production up -d --wait

      # 公開している疎通確認コマンド自体がproductionイメージで成立することを確かめる
      - name: Run healthcheck
        run: make healthcheck

      - name: Run backup test
        run: make test-backup

      - name: Run DB integration test
        run: make test-db COMPOSE_EXTRA_PROFILES=ci CI=true

      - name: Run e2e test
        run: make test-e2e COMPOSE_EXTRA_PROFILES=ci CI=true E2E_SKIP_INSTALL=1

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --profile=production --profile=ci logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose --profile=production --profile=ci down --volumes --remove-orphans
