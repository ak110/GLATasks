name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
    defaults:
      run:
        shell: bash
    env:
      # mise・pinact 等が GitHub API へアクセスする際の rate limit (403) 回避。
      # container job では明示しないと secrets.GITHUB_TOKEN がコンテナへ渡らない
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: GitHub Actionsのピン留め検証
        run: pinact run --check

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /cache
          key: pyfltr-cache-${{ runner.os }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint with pyfltr
        run: pyfltr ci --output-format=github-annotations

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: CI 用 .env を生成
        run: |
          DATA_DIR="${RUNNER_TEMP}/glatasks-data"
          mkdir -p "${DATA_DIR}"
          chmod 777 "${DATA_DIR}"
          {
            echo "COMPOSE_PROFILE=production"
            echo "DATA_DIR=${DATA_DIR}"
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
          } > .env

      - name: SSL 自己署名証明書を生成
        run: |
          cp web/openssl.cnf-example web/openssl.cnf
          bash web/keygen.sh

      - name: Build production image (ghcr.io/ak110/glatasks:latest)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ghcr.io/ak110/glatasks:latest

      - name: Start stack (production profile)
        run: docker compose --profile=production up -d --wait

      - name: Run backup test
        run: make test-backup

      - name: Run e2e test
        run: |
          docker compose --profile=production --profile=ci run --rm \
            --env=BASE_URL=https://web \
            playwright \
            bash -xc '
              PNPM_VERSION=$(node -e "const p=require(\"./package.json\"); console.log((p.packageManager||\"\").split(\"@\")[1]?.split(\"+\")[0]||\"latest\")") &&
              npm install -g pnpm@${PNPM_VERSION} --prefix=${PWD}/.cache/playwright --force &&
              export PATH=${PWD}/.cache/playwright/bin:${PWD}/node_modules/.bin:$PATH &&
              pnpm install --frozen-lockfile &&
              pnpm run test:e2e
            '

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --profile=production --profile=ci logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose --profile=production --profile=ci down --volumes --remove-orphans
