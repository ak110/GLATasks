name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: GitHub Actions のピン留め検証
        run: |
          go install github.com/suzuki-shunsuke/pinact/v3/cmd/pinact@v3.9.0
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$GOPATH_BIN:$PATH"
          pinact run --check

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint with pyfltr
        run: uvx pyfltr ci

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: CI 用 .env を生成
        run: |
          DATA_DIR="${RUNNER_TEMP}/glatasks-data"
          mkdir -p "${DATA_DIR}"
          {
            echo "COMPOSE_PROFILE=production"
            echo "DATA_DIR=${DATA_DIR}"
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
          } > .env

      - name: Build production image (ghcr.io/ak110/glatasks:latest)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ghcr.io/ak110/glatasks:latest

      - name: Start stack (production profile)
        run: docker compose --profile production up -d --wait

      - name: Run backup test
        run: make test-backup

      - name: Run e2e test
        run: |
          docker compose --profile production --profile ci run --rm \
            --env=BASE_URL=https://web \
            playwright \
            bash -xc '
              PNPM_VERSION=$(node -e "const p=require(\"./package.json\"); console.log((p.packageManager||\"\").split(\"@\")[1]?.split(\"+\")[0]||\"latest\")") &&
              npm install -g pnpm@${PNPM_VERSION} --prefix ${PWD}/.cache/playwright --force &&
              export PATH=${PWD}/.cache/playwright/bin:${PWD}/node_modules/.bin:$PATH &&
              pnpm install --frozen-lockfile &&
              pnpm run test:e2e
            '

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --profile production --profile ci logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose --profile production --profile ci down --volumes --remove-orphans
