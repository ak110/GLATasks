---
services:
  app:
    extends:
      file: compose.common.yaml
      service: app
    image: node:lts
    restart: always
    command: >
      bash -xc '
        npm install --global --prefix="${PWD}/.cache/corepack" --before="$$(date -u -d yesterday +%Y-%m-%dT%H:%M:%SZ)" corepack &&
        export PATH="${PWD}/.cache/corepack/bin:${PWD}/node_modules/.bin:$$PATH" &&
        corepack enable pnpm &&
        pnpm install --frozen-lockfile &&
        exec pnpm run dev
      '
    user: ${UID}:${GID}
    environment:
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-https://localhost:38180}
      - HOME=${PWD}/.cache
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    volumes:
      - ${PWD}:${PWD}
      - ${DATA_DIR}:${DATA_DIR}
    working_dir: ${PWD}
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
