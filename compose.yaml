---
services:
  web:
    extends:
      file: compose.common.yaml
      service: logged
    image: nginx
    restart: always
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./web/ssl:/etc/nginx/ssl:ro
    environment:
      - TZ=Asia/Tokyo
    networks:
      - network
    ports:
      - "38180:443"
    depends_on:
      - app

  db:
    extends:
      file: compose.common.yaml
      service: db
    image: mariadb:lts
    restart: always
    volumes:
      - ${DATA_DIR}/mariadb:/var/lib/mysql
      - ${PWD}/db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping --protocol=tcp --host=127.0.0.1 --user=root --password="$$MARIADB_ROOT_PASSWORD" | grep 'is alive'
      start_period: 30s
      start_interval: 1s
    networks:
      - network

  migrate:
    extends:
      file: compose.common.yaml
      service: migrate
    profiles:
      - production
      - staging
    image: ghcr.io/ak110/glatasks:latest
    restart: "no"
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/migrate.mjs"]

  migrate-dev:
    extends:
      file: compose.common.yaml
      service: migrate
    profiles:
      - development
    image: node:lts
    restart: "no"
    user: ${UID}:${GID}
    environment:
      - HOME=${PWD}/.cache
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    volumes:
      - ${PWD}:${PWD}
    working_dir: ${PWD}
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -xc '
        mkdir -p ${PWD}/.cache/bin &&
        corepack enable --install-directory=${PWD}/.cache/bin &&
        export PATH=${PWD}/.cache/bin:$$PATH &&
        pnpm install --frozen-lockfile &&
        pnpm run db:migrate
      '

  playwright:
    extends:
      file: compose.common.yaml
      service: playwright
    profiles:
      - development
      - ci
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Chromiumは共有メモリを多用するため、Dockerの既定の共有メモリサイズ（64MB）では
    # 不足時にブラウザプロセスが異常終了する。Playwright公式のDocker運用ガイドが
    # 推奨する構成に合わせ、ホストのIPC名前空間を共有する。
    # 参照: https://github.com/microsoft/playwright/blob/main/docs/src/docker.md
    ipc: host
    # ゾンビプロセス防止のためのinitプロセス採用も同ガイドの推奨事項である。
    init: true
    user: ${UID}:${GID}
    environment:
      - HOME=${PWD}/.cache/playwright
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - ${PWD}:${PWD}
    working_dir: ${PWD}
    networks:
      - network

include:
  - ./compose.${COMPOSE_PROFILE}.yaml

networks:
  network:
