# uv/pyfltr 専用の設定ファイル

[tool.uv]
exclude-newer = "1 day"

[tool.pyfltr]
preset = "latest"
# JS/TS 系ツール（eslint / prettier / vitest / oxlint / biome）を一括で有効化する。
javascript = true
# JS 系ツールは package.json で管理するため pnpm runner を使う。
# node_modules/.bin の実行ファイルを pnpm exec 経由で呼び出す。
js-runner = "pnpm"

# javascript ゲート経由で有効になるが、本プロジェクトでは未採用のため個別に無効化する。
biome = false
tsc = false

# pyfltr の除外パターン。eslint / prettier は独自の ignore 設定
# (eslint.config.js の ignores / .prettierignore) を持つが、
# pyfltr 側でもファイル列挙時点で除外することで高速化する。
extend-exclude = [
    "app/.svelte-kit",
    "app/build",
    "app/tests",
    # app/package.json はルート package.json へのシンボリックリンク。
    # prettier は明示的に指定されたシンボリックリンクを拒否するため、
    # pyfltr 側のファイル列挙時点で除外する。
    "app/package.json",
    ".cache",
    "drizzle/migrations",
    "test-results",
    "chrome_extension/dist",
]

# svelte-check を pyfltr の custom-commands として統合する。
# `pnpm run check` は `svelte-kit sync && svelte-check` の複合スクリプトで、
# プロジェクト全体を一括検査する (ファイル単位実行は未対応)。このため
# pass-filenames = false とし、対象ファイルは実行可否判定のみに使う。
# fast = false でコミット前の `pyfltr fast` からは除外し、`pyfltr run` /
# `pyfltr ci` のみで実行する。
[tool.pyfltr.custom-commands.svelte-check]
type = "linter"
path = "pnpm"
args = ["run", "check"]
targets = ["*.svelte", "*.ts", "*.tsx", "*.js", "*.mjs", "*.cjs"]
pass-filenames = false
fast = false
