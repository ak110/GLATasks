# uv/pyfltr 専用の設定ファイル

[tool.uv]
exclude-newer = "1 day"

[tool.pyfltr]
preset = "latest"
colloquial-check = true
colloquial-check-exclude = ["app/src/routes/timers/+page.svelte"]
comment-check = true
# JS/TS 系ツール（eslint / prettier / vitest / oxlint / biome）を一括で有効化する。
javascript = true
# JS 系ツールは package.json で管理するため pnpm runner を使う。
# node_modules/.bin の実行ファイルを pnpm exec 経由で呼び出す。
js-runner = "pnpm"
# mise.tomlのsymlink_binsでPATHへ公開したactionlint本体を直接実行する。
# mise runnerへ戻すと、CIコンテナ内の旧shimを解決して実体を見つけられない。
actionlint-runner = "direct"

# javascript ゲート経由で有効になるが、本プロジェクトでは未採用のため個別に無効化する。
biome = false
tsc = false
# アプリのworkspaceで導入するVitestは、syncを含む公開スクリプトから実行する。
vitest = false

# pyfltr の除外パターン。eslint / prettier は独自の ignore 設定
# (eslint.config.js の ignores / .prettierignore) を持つが、
# pyfltr 側でもファイル列挙時点で除外することで高速化する。
extend-exclude = [
    "app/.svelte-kit",
    "app/build",
    ".cache",
    "drizzle/migrations",
    "test-results",
    "chrome_extension/dist",
]

# svelte-check を pyfltr の custom-commands として統合する。
# アプリのcheckはsvelte-kit sync後に全体を型検査する。
# --incrementalで変換済みファイルを次回の検査に再利用する。
# 対象ファイルは実行可否の判定にだけ使う。
# fast = false でコミット前の `pyfltr fast` からは除外し、`pyfltr run` /
# `pyfltr ci` のみで実行する。
[tool.pyfltr.custom-commands.svelte-check]
type = "linter"
path = "pnpm"
args = ["--dir", "app", "run", "check", "--incremental"]
targets = ["*.svelte", "*.ts", "*.tsx", "*.js", "*.mjs", "*.cjs"]
pass-filenames = false
fast = false

[tool.pyfltr.custom-commands.app-unit]
type = "tester"
path = "pnpm"
# pnpm runがスクリプト末尾へ追加引数を渡すため、vitest runへ届く。
# テスト名と個別の合否を保存出力だけで確認できるよう、verboseのreporterを使う。
args = ["--dir", "app", "run", "test:unit", "--reporter=verbose"]
targets = ["*.svelte", "*.ts", "*.tsx", "*.js", "*.mjs", "*.cjs"]
pass-filenames = false
fast = false
