---
services:
  app:
    extends:
      file: compose.common.yaml
      service: app
    image: ghcr.io/ak110/glatasks:latest
    restart: always
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000/healthcheck')
          .then(r => { if (!r.ok) process.exit(1) })
          .catch(() => process.exit(1))
      start_period: 30s
      start_interval: 1s
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
