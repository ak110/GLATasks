---
services:
  app:
    image: ghcr.io/ak110/glatasks:latest
    restart: always
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000/healthcheck')
          .then(r => { if (!r.ok) process.exit(1) })
          .catch(() => process.exit(1))
      start_period: 30s
      start_interval: 1s
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
    environment:
      - DATABASE_URL=mysql://glatasks:glatasks@db/glatasks
      - DATA_DIR
      - PROTOCOL_HEADER=X-Forwarded-Proto
    networks:
      - network
    logging:
      options:
        max-size: "1m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
