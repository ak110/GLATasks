# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        exclude: pnpm-lock\.yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^dist/.*$
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: ^dist/.*$

  - repo: local
    hooks:
      - id: pyfltr
        name: pyfltr
        # eslint / prettier / textlint / markdownlint を pyfltr 経由でまとめて実行する。
        entry: uvx pyfltr fast
        types_or: [javascript, jsx, ts, tsx, svelte, json, css, yaml, markdown]
        require_serial: true
        language: system
      - id: vitepress-build
        name: VitePress build
        entry: bash -c 'CI=1 pnpm --dir=docs run build'
        language: system
        pass_filenames: false
        files: ^docs/.*\.(md|ts|json)$|^docs/\.vitepress/
